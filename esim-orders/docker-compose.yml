services:
  postgres:
    image: postgres:17
    container_name: esim_orders_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: esim_orders
    ports:
      - '5434:5432'
    volumes:
      - esim_orders_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d esim_orders_test']
      interval: 1s
      timeout: 3s
      retries: 30

volumes:
  esim_orders_data:
